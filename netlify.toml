# Настройки публикации на Netlify (бесплатный тариф допускает коммерческое использование).
# Переменные окружения (DATABASE_URL, AUTH_SECRET, SITE_URL, TRUSTED_PROXY_COUNT=1, DB_POOL_MAX=3)
# задаются в панели Netlify: Site configuration → Environment variables.
[build]
  # Перед сборкой: миграции, демо-наполнение пустой базы и первый администратор (ADMIN_NAME/ADMIN_PASSWORD).
  command = "npm run db:bootstrap && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
